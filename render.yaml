services:
  - type: web
    name: crypto-comply
    runtime: node
    region: frankfurt       # moved from oregon 2026-05-17 to colocate with EU Neon DB (eu-west-2) — cuts query latency from ~150ms to ~10-15ms; aligns with EnableGRC EU posture
    plan: starter           # upgrade to standard for prod; starter is fine for demo
    buildCommand: npm ci --include=dev && npx prisma generate && npx tsc --module commonjs --target es2017 --esModuleInterop true --skipLibCheck true prisma/seed.ts && npm run build
    startCommand: bash render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false         # set manually in Render dashboard — paste your Neon connection string
      - key: NEXTAUTH_SECRET
        generateValue: true # Render auto-generates a secure random value
      - key: NEXTAUTH_URL
        sync: false         # set to your Render URL, e.g. https://crypto-comply.onrender.com
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: CryptoComply
